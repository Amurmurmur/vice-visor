  <g clip-path="url(#tile)">
    <rect width="128" height="128" fill="url(#sky)"/>
    <circle cx="64" cy="78" r="40" fill="url(#sun)" mask="url(#stripes)"/>
    <!-- sunglasses -->
    <rect x="8" y="38" width="112" height="9" rx="4.5" fill="#07040d"/>
    <path d="M12 44h46v12c0 11-8 19-20 19h-6C20 75 12 67 12 56z" fill="url(#lens)"/>
    <path d="M70 44h46v12c0 11-8 19-20 19h-6c-12 0-20-8-20-19z" fill="url(#lens)"/>
    <path d="M19 50h14l-9 17c-3-3-5-7-5-11z" fill="#fff" opacity="0.28"/>
    <path d="M77 50h14l-9 17c-3-3-5-7-5-11z" fill="#fff" opacity="0.28"/>
  </g>
</svg>

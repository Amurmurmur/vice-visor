    <mask id="stripes">
      <rect width="128" height="128" fill="#fff"/>
      <rect y="84" width="128" height="4" fill="#000"/>
      <rect y="93" width="128" height="5" fill="#000"/>
      <rect y="103" width="128" height="6" fill="#000"/>
    </mask>
    <clipPath id="tile">
      <rect width="128" height="128" rx="28"/>
